<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATC Tender Intelligence</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1350px;margin:auto;padding:24px}.hero{background:#111827;color:white;border-radius:22px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:#cbd5e1}.live{display:inline-block;margin-top:14px;background:#173b2c;border:1px solid #276749;color:#b8f2d1;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar select,.toolbar input,.toolbar button{padding:11px 13px;border:1px solid #d8deea;border-radius:10px;background:white;font:inherit}.toolbar input{min-width:220px;flex:1}.toolbar button{cursor:pointer;font-weight:700;background:#111827;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid #e5e9f2;border-radius:15px;padding:16px}.stat b{display:block;font-size:24px;margin-top:5px}.muted{color:#64748b;font-size:13px}.cards{display:grid;gap:12px}.card{background:white;border:1px solid #e2e7f0;border-radius:16px;padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.title{font-weight:750;font-size:18px;color:#111827}.score{background:#e9f8ef;color:#087443;border-radius:999px;padding:6px 10px;font-weight:800;white-space:nowrap}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#eef2f7;border-radius:999px;padding:5px 9px;font-size:12px}.source{background:#e8eefc}.desc{color:#475569;line-height:1.5}.actions{margin-top:14px}.actions a{display:inline-block;background:#111827;color:white;text-decoration:none;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700}.status{padding:14px;background:white;border-radius:14px;border:1px solid #e2e7f0}.error{color:#b42318}.empty{text-align:center;padding:40px;color:#64748b}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}.top{flex-direction:column}}
</style></head>
<body><div class="wrap">
<section class="hero"><h1>ATC Tender Intelligence</h1><p>Live procurement opportunities for ATC simulation, selection, training, procedure design and AIM/AIS.</p><span class="live">● LIVE ONLY · EXPIRED NOTICES REMOVED</span></section>
<div class="toolbar"><select id="category"><option>All</option></select><select id="country"><option>All</option></select><select id="source"><option>All</option></select><select id="score"><option value="10">Relevant</option><option value="30">High priority</option><option value="0">All live matches</option></select><input id="search" placeholder="Search tender, buyer, country or source..."><button onclick="loadTenders()">Refresh live data</button></div>
<div class="stats"><div class="stat"><span class="muted">Live opportunities</span><b id="count">-</b></div><div class="stat"><span class="muted">High priority</span><b id="high">-</b></div><div class="stat"><span class="muted">Countries</span><b id="countries">-</b></div><div class="stat"><span class="muted">Sources</span><b id="sources">-</b></div></div>
<div id="status" class="status">Searching live procurement notices...</div><div id="cards" class="cards"></div>
</div>
<script>
let all=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){const cat=document.getElementById('category').value,country=document.getElementById('country').value,source=document.getElementById('source').value,q=document.getElementById('search').value.toLowerCase();const items=all.filter(x=>(cat==='All'||(x.matched_categories||[]).includes(cat))&&(country==='All'||x.country===country)&&(source==='All'||x.source===source)&&`${x.title} ${x.buyer} ${x.country} ${x.source}`.toLowerCase().includes(q));document.getElementById('count').textContent=items.length;document.getElementById('high').textContent=items.filter(x=>x.score>=30).length;document.getElementById('countries').textContent=new Set(items.map(x=>x.country).filter(Boolean)).size;document.getElementById('sources').textContent=new Set(items.map(x=>x.source).filter(Boolean)).size;const cards=document.getElementById('cards');if(!items.length){cards.innerHTML='<div class="empty">No live matching opportunities found.</div>';return}cards.innerHTML=items.map(x=>`<article class="card"><div class="top"><div class="title">${esc(x.title)}</div><div class="score">${x.score} relevance</div></div><div class="meta">${(x.matched_categories||[]).map(c=>`<span class="pill">${esc(c)}</span>`).join('')}<span class="pill source">${esc(x.source||'Unknown source')}</span>${x.country?`<span class="pill">${esc(x.country)}</span>`:''}</div><div class="muted">${esc(x.buyer||'Buyer not supplied')} · Published ${esc(x.published||'')} · <strong>LIVE</strong></div><p class="desc">${esc((x.description||'').slice(0,500))}${x.description&&x.description.length>500?'…':''}</p>${x.deadline?`<div class="muted"><strong>Closes:</strong> ${esc(x.deadline)}</div>`:''}<div class="actions">${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener">Open original tender ↗</a>`:''}</div></article>`).join('')}
async function loadTenders(){const status=document.getElementById('status');status.textContent='Checking TED, NZ GETS and UK Find a Tender for live opportunities...';status.className='status';try{const min=document.getElementById('score').value;const r=await fetch(`/api/tenders?min_score=${min}`);const d=await r.json();all=d.results||[];const fill=(id,values)=>{const s=document.getElementById(id),cur=s.value;s.innerHTML='<option>All</option>'+values.map(v=>`<option>${esc(v)}</option>`).join('');if(values.includes(cur))s.value=cur};fill('category',d.categories||[]);fill('country',d.countries||[]);fill('source',d.sources||[]);status.textContent=`Last checked ${new Date(d.updated_at).toLocaleString()} · ${all.length} live relevant notices · expired notices excluded`;render();if(d.errors?.length)status.innerHTML+=` <span class="error">Some sources reported an error.</span>`}catch(e){status.innerHTML='<span class="error">The tender API could not be reached. Check the Vercel function logs.</span>';document.getElementById('cards').innerHTML=''}}
document.getElementById('category').onchange=render;document.getElementById('country').onchange=render;document.getElementById('source').onchange=render;document.getElementById('search').oninput=render;loadTenders();
</script></body></html>
